<title>WibeBlock Docs Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: two fixed panes (document map | session context) under a slim header; popups float above as draggable windows.
   Palette follows the WibeBlock plan map and UI kit: beige ground, brown ink, blue/orange/red/lime as load-class signals. */
:root {
  --bg: #f4ede1;
  --surface: #fffaf2;
  --sunken: #ece3d4;
  --lane: #efe6d7;
  --fg: #2a1f17;
  --muted: #6f5f50;
  --line: #ddd0bc;
  --line-strong: #c7b69d;
  --accent: #2b66c9;
  --edge: #a08a72;
  --l-auto: #557a0d;
  --l-recall: #c46a12;
  --l-rule: #2b66c9;
  --l-command: #c8431d;
  --l-skill: #8b5a36;
  --l-manual: #9a8877;
  --s-draft: #9a8877;
  --s-ready: #2b66c9;
  --s-progress: #c46a12;
  --s-done: #4f8a12;
  --warn: #b83a27;
  --on-color: #ffffff;
  --shadow: 0 1px 2px rgba(60, 40, 20, .08), 0 12px 32px rgba(60, 40, 20, .18);
  --display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --text: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1611; --surface: #261e18; --sunken: #30261f; --lane: #2a211b; --fg: #f2e9dc; --muted: #b5a591;
    --line: #463a2f; --line-strong: #5c4d3f; --accent: #74a5ff; --edge: #8c7864;
    --l-auto: #b4e14b; --l-recall: #f5a04a; --l-rule: #74a5ff; --l-command: #ff7b52; --l-skill: #cf9a72; --l-manual: #9c8d7c;
    --s-draft: #9c8d7c; --s-ready: #74a5ff; --s-progress: #f5a04a; --s-done: #b4e14b; --warn: #ef7a66;
    --on-color: #1c1611; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1611; --surface: #261e18; --sunken: #30261f; --lane: #2a211b; --fg: #f2e9dc; --muted: #b5a591;
  --line: #463a2f; --line-strong: #5c4d3f; --accent: #74a5ff; --edge: #8c7864;
  --l-auto: #b4e14b; --l-recall: #f5a04a; --l-rule: #74a5ff; --l-command: #ff7b52; --l-skill: #cf9a72; --l-manual: #9c8d7c;
  --s-draft: #9c8d7c; --s-ready: #74a5ff; --s-progress: #f5a04a; --s-done: #b4e14b; --warn: #ef7a66;
  --on-color: #1c1611; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--text); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; gap: 12px;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 24px; }
.top h1 { font: 800 22px/1.1 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.top p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

.panes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.pane.map .pane-body { overflow-x: auto; overflow-y: hidden; flex: none; }
.pane.ctxp .pane-body { overflow: visible; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pane-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.pane-bar h2 { font: 700 15px/1.2 var(--display); margin: 0; }
.pane-bar .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.pane-bar .spacer { flex: 1; }
.pane-body { flex: 1; min-height: 0; overflow: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--sunken); color: var(--fg); font-weight: 600; }
.seg .zl { min-width: 46px; font-variant-numeric: tabular-nums; }
.tgl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }


/* ---------- marks ---------- */
.mark { width: 9px; height: 9px; border-radius: 2px; flex: none; display: inline-block; background: var(--l-manual); }
.mark[data-l="auto"] { background: var(--l-auto); }
.mark[data-l="recall"] { background: var(--l-recall); }
.mark[data-l="rule"] { background: var(--l-rule); }
.mark[data-l="command"] { background: var(--l-command); }
.mark[data-l="skill"] { background: var(--l-skill); border-radius: 50%; }
.mark[data-l="manual"] { background: var(--l-manual); }
.mark[data-l="none"] { background: transparent; border: 1.5px dashed var(--l-manual); }

/* ---------- board ---------- */
.sizer { position: relative; }
.board { position: absolute; left: 0; top: 0; width: 1360px; padding: 18px; transform-origin: 0 0; display: flex; flex-direction: column; gap: 30px; }
.edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 1; }
.edges path { fill: none; stroke: var(--edge); stroke-width: 1.2; opacity: .32; }
.edges .hov path { opacity: 1; stroke-width: 1.8; }
.edges .hov path.out { stroke: var(--accent); }
.edges .hov path.in { stroke: var(--l-recall); stroke-dasharray: 5 4; }
.edges marker path { opacity: 1; stroke: none; }
.board.focus .edges .base path { opacity: .12; }
.lane { background: var(--lane); border-radius: 14px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.lane-h > * { position: relative; z-index: 2; background: var(--lane); padding-right: 6px; }
.lane-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.lane-h h3 { margin: 0; font: 700 11px/1.2 var(--display); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.lane-h p { margin: 0; font-size: 12px; color: var(--muted); }
.lane-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.node { position: relative; z-index: 2; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px 8px; width: 196px; cursor: pointer; transition: border-color .12s, box-shadow .12s, opacity .12s; }
.node:hover, .node.hl { border-color: var(--line-strong); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.node-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.node-file { font: 400 11px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.node-title { font: 600 13.5px/1.3 var(--text); margin-top: 2px; }
.node-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.tag { font: 500 10px/1 var(--text); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; margin-left: auto; flex: none; }
.warn { margin-left: auto; flex: none; width: 15px; height: 15px; border-radius: 50%; background: var(--warn); color: var(--on-color); font: 700 10px/15px var(--text); text-align: center; }
.cluster { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 6px; flex: 1 1 260px; min-width: 200px; }
.cluster-h { font: 400 11px/1.3 var(--mono); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; max-width: 100%; }
.chip:hover, .chip.hl { border-color: var(--line-strong); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.chip .warn { margin-left: 2px; width: 13px; height: 13px; line-height: 13px; font-size: 9px; }

/* ---------- conflict badges: red counters on docs and rules; a click opens the conflicting parts ---------- */
.cbadge { flex: none; display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border: 0; border-radius: 9px; background: var(--warn); color: var(--on-color); font: 700 10.5px/1 var(--text); font-variant-numeric: tabular-nums; cursor: pointer; position: relative; z-index: 3; box-shadow: 0 0 0 2px var(--surface); }
.cbadge:hover { filter: brightness(1.12); }
.cbadge:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.node-top .cbadge, .feat .node-title .cbadge, .rule .cbadge, .part-h .cbadge { margin-left: auto; }
.node-top .cbadge + .tag { margin-left: 4px; }
.part-h .cbadge { align-self: center; }
.rule .cbadge { align-self: center; }
.chip .cbadge, .src .cbadge { min-width: 16px; height: 16px; padding: 0 4px; font-size: 9.5px; margin-left: 2px; }
.ep .cbadge { position: absolute; top: -9px; right: -9px; min-width: 15px; height: 15px; padding: 0 4px; font-size: 9px; }
.ep:has(.cbadge) { margin-right: 7px; }
.eps:has(.cbadge) { padding-top: 5px; }
.legend .cbadge { cursor: default; box-shadow: none; }
.cmenu { position: fixed; z-index: 5000; width: max-content; min-width: 240px; max-width: min(400px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; gap: 1px; }
.cmenu h4 { margin: 3px 8px 5px; font: 700 11px/1.3 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.cmenu button { display: flex; gap: 8px; align-items: baseline; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 12.5px; line-height: 1.35; }
.cmenu button:hover, .cmenu button:focus-visible { background: var(--sunken); outline: none; }
.cmenu small { margin-left: auto; padding-left: 10px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.plan-top { display: flex; flex-wrap: wrap; gap: 10px; }
.parts { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr; gap: 12px; align-items: start; }
.part[data-part="learning-track"] .feats, .part[data-part="mobile"] .feats { grid-template-columns: 1fr; }
.part { border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, var(--surface) 45%, transparent); }
.part-h.node { width: auto; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.part-h .node-title { font: 700 15px/1.2 var(--display); margin: 0; }
.part-h .node-meta { margin: 0; }
.feats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.feat.node { width: auto; padding: 6px 8px 7px; }
.feat .node-title { font-size: 13px; margin: 0; display: flex; gap: 6px; align-items: center; }
.eps { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
.ep { position: relative; z-index: 2; font: 500 10.5px/1.2 var(--mono); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--s-draft); color: var(--fg); background: var(--surface); cursor: pointer; font-variant-numeric: tabular-nums; }
.ep[data-s="ready"] { border-color: var(--s-ready); color: var(--s-ready); }
.ep[data-s="in progress"] { background: var(--s-progress); border-color: var(--s-progress); color: var(--on-color); }
.ep[data-s="done"] { background: var(--s-done); border-color: var(--s-done); color: var(--on-color); }
.ep.ghost { border-style: dashed; color: var(--muted); background: transparent; cursor: help; }
.ep:not(.ghost):hover, .ep.hl { outline: 2px solid var(--accent); outline-offset: 1px; }
.status-legend { display: inline-flex; gap: 5px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.status-legend .ep { cursor: default; }

.board.focus .node:not(.cur):not(.rel):not(.part):not(.feat), .board.focus .chip:not(.cur):not(.rel), .board.focus .ep:not(.cur):not(.rel) { opacity: .38; }
.board.focus .feat:not(.cur):not(.rel):not(:has(.cur, .rel)) { opacity: .38; }
.board.focus .part-h:not(.cur):not(.rel) { opacity: .55; }
.node.cur, .chip.cur, .ep.cur { box-shadow: 0 0 0 2px var(--accent); opacity: 1; }
@keyframes flash { 0%, 100% { box-shadow: 0 0 0 2px transparent; } 30%, 70% { box-shadow: 0 0 0 4px var(--accent); } }
.flash { animation: flash 1.1s ease 2; }

/* ---------- context pane ---------- */
.ctx { padding: 14px 16px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px 32px; }
.ctx-side, .ctx-main { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 900px) { .ctx { grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); }  }
.meter { display: flex; flex-direction: column; gap: 8px; }
.meter-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.meter-head b { font: 700 20px/1 var(--display); font-variant-numeric: tabular-nums; }
.meter-head span { color: var(--muted); font-size: 12.5px; }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunken); gap: 2px; }
.bar i { display: block; height: 100%; }
.bar-key { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; font-size: 12px; align-items: center; }
.bar-key .mark { margin-top: 1px; }
.bar-key .n { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }

.layers { display: flex; flex-direction: column; gap: 0; position: relative; }
.layer { position: relative; padding: 0 0 14px 30px; }
.layer::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 1px; background: var(--line); }
.layer:last-child::before { display: none; }
.layer-num { position: absolute; left: 0; top: 0; width: 21px; height: 21px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); font: 600 11px/19px var(--text); text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.layer-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-height: 21px; }
.layer-h h3 { margin: 0; font: 700 13.5px/1.3 var(--display); }
.layer-h .n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.layer-when { margin: 1px 0 6px; color: var(--muted); font-size: 12px; }
.layer.sys { opacity: .75; }
.srcs { display: flex; flex-direction: column; gap: 4px; }
.src { display: grid; grid-template-columns: 20px auto minmax(0, 1fr) auto; align-items: center; gap: 0 7px; padding: 5px 8px 5px 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.src:hover, .src.hl { border-color: var(--line-strong); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.src-name { min-width: 0; display: flex; align-items: baseline; gap: 7px; overflow: hidden; }
.src-name b { font-weight: 600; white-space: nowrap; }
.src-name small { font: 400 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src-meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.src .warn { margin: 0 0 0 2px; width: 14px; height: 14px; line-height: 14px; font-size: 9px; display: inline-block; }
.chev { width: 20px; height: 20px; border: 0; background: transparent; cursor: pointer; border-radius: 5px; color: var(--muted); display: grid; place-items: center; padding: 0; }
.chev:hover { background: var(--sunken); color: var(--fg); }
.chev svg { transition: transform .15s; }
.chev[aria-expanded="true"] svg { transform: rotate(90deg); }
.chev:disabled { visibility: hidden; }
.rules { list-style: none; margin: 2px 0 6px 12px; padding: 0 0 0 10px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; }
.rule { display: flex; align-items: baseline; gap: 7px; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 12.5px; line-height: 1.4; }
.rule:hover { background: var(--sunken); }
.rule.off { opacity: .6; }
.tchip { flex: none; font: 500 10px/1.5 var(--text); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
.schip { flex: none; display: inline-flex; align-items: center; gap: 4px; font: 400 10.5px/1.5 var(--mono); color: var(--muted); white-space: nowrap; }
.rule .rt { min-width: 0; }
.topic { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto auto; align-items: center; gap: 0 8px; padding: 5px 8px 5px 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.topic:hover { border-color: var(--line-strong); }
.topic b { font-weight: 600; }
.topic .dots { display: flex; gap: 3px; }
.topic .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.never { display: flex; flex-wrap: wrap; gap: 5px; }

.notes h3 { margin: 0 0 6px; font: 700 13.5px/1.3 var(--display); }
.note { display: flex; align-items: baseline; gap: 8px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 12.5px; background: var(--surface); margin-bottom: 4px; }
.note:hover { border-color: var(--line-strong); }
.pill { flex: none; font: 600 10px/1.6 var(--text); letter-spacing: .05em; text-transform: uppercase; border-radius: 4px; padding: 0 5px; color: var(--on-color); background: var(--l-manual); }
.pill[data-k="gap"] { background: var(--l-recall); }
.pill[data-k="conflict"] { background: var(--warn); }
.pill[data-k="stale"] { background: var(--l-manual); }
.pill[data-k="override"] { background: var(--l-rule); }

/* ---------- tooltip ---------- */
.tip { position: fixed; z-index: 10000; max-width: 340px; background: var(--surface); color: var(--fg); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 9px 11px; font-size: 12.5px; line-height: 1.45; pointer-events: none; }
.tip-h { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px; }
.tip-path { font: 400 11px var(--mono); color: var(--muted); margin-top: 1px; word-break: break-all; }
.tip p { margin: 6px 0 0; }
.tip .k { color: var(--muted); }
.tip ul { margin: 6px 0 0; padding-left: 16px; }
.tip li { margin: 1px 0; }
.tip-hint { margin: -2px 0 6px; color: var(--muted); font-size: 11px; }
.tip-hint kbd { font: 600 10.5px var(--mono); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; }
.tip-off .tip { visibility: hidden; }
.tip-foot { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }

/* ---------- windows ---------- */
.win-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
.win { position: fixed; pointer-events: auto; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; min-width: 280px; min-height: 160px; }
.win.front { border-color: color-mix(in srgb, var(--accent) 55%, var(--line-strong)); }
.win-bar { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; background: var(--sunken); border-bottom: 1px solid var(--line); cursor: grab; user-select: none; touch-action: none; }
.win-bar:active { cursor: grabbing; }
.win-title { min-width: 0; display: flex; align-items: baseline; gap: 8px; flex: 1; overflow: hidden; }
.win-title b { font: 700 14px/1.3 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; max-width: 70%; }
.win-title small { flex: 1 1 0; min-width: 0; }
.win-title small { font: 400 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wbtn { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 7px; font-size: 12px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.wbtn:hover { background: var(--surface); border-color: var(--line); color: var(--fg); }
.wbtn.x { font-size: 16px; line-height: 1; padding: 2px 7px 4px; }
.win-body { flex: 1; min-height: 0; overflow: auto; }
.rz { position: absolute; z-index: 2; touch-action: none; }
.rz[data-d="n"], .rz[data-d="s"] { left: 8px; right: 8px; height: 7px; cursor: ns-resize; }

<script>const DATA = __DATA__;</script>
<script>
(() => {
const D = DATA;
const docs = new Map(D.docs.map((d) => [d.id, d]));
const rules = new Map(D.rules.map((r) => [r.id, r]));
const rulesBySrc = new Map();
for (const r of D.rules) { if (!rulesBySrc.has(r.src)) rulesBySrc.set(r.src, []); rulesBySrc.get(r.src).push(r); }
const inbound = new Map(D.docs.map((d) => [d.id, []]));
for (const d of D.docs) for (const l of d.links) inbound.get(l)?.push(d.id);
// ---------- findings: Claude writes findings.json next to this page; removing items here saves that file ----------
let F = { items: [] }, findingsState = 'loading';
const byNote = new Map(), cByDoc = new Map(), cByRule = new Map();
const pushTo = (m, k, v) => { if (!m.has(k)) m.set(k, []); if (!m.get(k).includes(v)) m.get(k).push(v); };
const docsOf = (n) => [...new Set([...(n.sides || []).map((s) => s.doc), ...(n.also || [])])];
const indexFindings = () => {
  byNote.clear(); cByDoc.clear(); cByRule.clear();
  for (const n of F.items) {
    byNote.set(n.id, n);
    if (n.kind !== 'conflict' || ticked.has(n.id) || hasNote(n)) continue;
    for (const s of n.sides || []) pushTo(cByDoc, s.doc, n.id);
    for (const r of n.rules || []) pushTo(cByRule, r, n.id);
  }
};
const cList = (key) => (key.startsWith('doc:') ? cByDoc.get(key.slice(4)) : cByRule.get(key.slice(5))) || [];
const badge = (key) => { const n = cList(key).length; return n ? `<button type="button" class="cbadge" data-cbadge="${key.replace(/"/g, '&quot;')}" aria-label="${n} conflict${n > 1 ? 's' : ''}: compare the parts">${n}</button>` : ''; };
const ruleBadge = (rid) => badge('rule:' + rid);
const LOADS = {
  auto: 'Always loaded', recall: 'Recalled from memory', rule: 'Read when a rule says so',
  skill: 'Picked by Claude when it fits', command: 'Loaded by a command', manual: 'Only when opened', none: 'Not loaded by Claude Code',
};
const G = '~/.claude/CLAUDE.md', C = 'CLAUDE.md', MI = 'memory/MEMORY.md';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tokN = (chars) => Math.round(chars / 4);
const fmtTok = (t) => t >= 1000 ? (t / 1000).toFixed(t >= 10000 ? 0 : 1) + 'k' : String(t);
const tok = (chars) => fmtTok(tokN(chars));
const rc = (id) => (rulesBySrc.get(id) || []).length;
const short = (id) => { const d = docs.get(id); return d.kind === 'memory' || d.name === 'SKILL.md' ? d.title : d.name; };
const $ = (s, el = document) => el.querySelector(s);
const sel = (id) => `[data-node="${CSS.escape(id)}"]`;

// ---------- legend ----------
$('#legend').innerHTML = Object.entries(LOADS).map(([k, v]) => `<span><i class="mark" data-l="${k}"></i>${v}</span>`).join('') +
  '<span id="legendC" hidden><i class="cbadge" aria-hidden="true">2</i>Conflicts: click a badge to compare the parts</span>';

// ---------- board ----------
const board = $('#board'), sizer = $('#sizer'), scroller = $('#mapScroll');

    <div class="node-title">${esc(d.title)}</div>

};
const chip = (id, label) => {
  const d = docs.get(id); if (!d) return ''; placed.add(id);
  return `<span class="chip" data-doc="${esc(id)}" data-node="${esc(id)}" tabindex="0" role="button"><i class="mark" data-l="${d.load}"></i>${esc(label || d.title)}</span>`;
};

const memFiles = D.docs.filter((d) => d.kind === 'memory');
const PARTS = ['studio', 'platform', 'learning-track', 'mobile'];
const epicById = new Map(D.docs.filter((d) => d.kind === 'epic').map((d) => [d.epic, d]));

let html = '<svg class="edges" id="edges"><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="var(--edge)"/></marker><marker id="ahA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="var(--accent)"/></marker><marker id="ahI" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="var(--l-recall)"/></marker></defs><g class="base"></g><g class="hov"></g></svg>';

  `<div class="lane-row">${card(G, { file: '~/.claude/CLAUDE.md', tag: 'Global' })}${card(C)}${card(MI, { file: 'memory/MEMORY.md', tag: 'Memory' })}
   <div class="cluster"><div class="cluster-h">memory/ · ${memFiles.length} files, outside the repo</div><div class="chips">${memFiles.map((d) => chip(d.id)).join('')}</div></div></div>`);

  `<div class="lane-row">${card('.claude/skills/whats-next/SKILL.md', { file: '.claude/skills/whats-next/', tag: 'Project' })}${card('.claude/skills/plan-part/SKILL.md', { file: '.claude/skills/plan-part/', tag: 'Project' })}${card('.claude/skills/docs-check/SKILL.md', { file: '.claude/skills/docs-check/', tag: 'Project' })}${card('~/.claude/skills/guide-me/SKILL.md', { file: '~/.claude/skills/guide-me/', tag: 'Personal' })}${card('~/.claude/skills/teach-me/SKILL.md', { file: '~/.claude/skills/teach-me/', tag: 'Personal' })}${card('~/.claude/skills/create-ticket/SKILL.md', { file: '~/.claude/skills/create-ticket/', tag: 'Personal' })}</div>`);
html += lane('Read on demand', 'A loaded rule tells Claude when to read these.',
  `<div class="lane-row">${['docs/development.md', 'docs/conventions.md', '.github/ISSUE_TEMPLATE/ticket.md'].map((id) => card(id)).join('')}</div>`);
const partHtml = PARTS.map((p) => {
  const pid = `docs/plan/parts/${p}/${p}.md`; const pd = docs.get(pid); placed.add(pid);

  rows.forEach((r, k) => {
    if (keep.has(k)) { cut = false; return; }
    if (!cut) { const g = document.createElement('tr'); g.className = 'cut'; g.innerHTML = `<td colspan="${cols}">· · ·</td>`; r.before(g); cut = true; }
    r.remove();
  });
});
// the part a side points at: the section holding the quote, or the blocks around it when the section is long
const renderPart = (d, s) => {
  const quotes = [].concat(s.quote || []);
  if (d.lang === 'html') {
    const lines = d.content.split('\n'), keep = new Set(), miss = [];
    for (const q of quotes) { const k = lines.findIndex((l) => l.includes(q)); if (k < 0) miss.push(q); else for (let j = Math.max(0, k - 1); j <= Math.min(lines.length - 1, k + 1); j++) keep.add(j); }
    let html = '', prev = null;
    for (const j of [...keep].sort((a, b) => a - b)) {
      if (prev !== null && j > prev + 1) html += '<span class="cw-gap">· · ·</span>';
      let line = esc(lines[j]); for (const q of quotes) line = line.split(esc(q)).join(`<mark class="cq">${esc(q)}</mark>`);
      html += `<span class="ln">${j + 1}</span>${line}\n`; prev = j;
    }
    const el = document.createElement('div');
    el.innerHTML = `${miss.length ? `<p class="cw-miss">Not found any more: ${miss.map((q) => `"${esc(q.slice(0, 90))}"`).join(', ')}. Run /docs-check again.</p>` : ''}<p class="cw-note">Source lines of the page, around each quote.</p><pre class="src">${html}</pre>`;
    return { el, sec: s.sec || '' };
  }
  const blocks = [...renderMd(d).children], keep = new Set();
  let sec = s.sec || '';
  for (const q of quotes) {
    const k = blocks.findIndex((b) => normT(b.textContent).includes(normT(q))); if (k < 0) continue;
    let hk = -1; for (let j = k; j >= 0; j--) if (isHead(blocks[j])) { hk = j; break; }
    const lvl = hk >= 0 ? +blocks[hk].tagName[1] : 9, start = Math.max(hk, 0);
    let end = blocks.length; for (let j = Math.max(hk, k) + 1; j < blocks.length; j++) if (isHead(blocks[j]) && +blocks[j].tagName[1] <= lvl) { end = j; break; }
    if (!sec && hk >= 0) sec = blocks[hk].textContent.trim();
    if (end - start <= 12) for (let j = start; j < end; j++) keep.add(j);
    else { if (hk >= 0) keep.add(hk); for (let j = Math.max(start + 1, k - 2); j <= Math.min(end - 1, k + 2); j++) keep.add(j); }
    keep.add(k);
  }
  const el = document.createElement('article'); el.className = 'md';
  let prev = null;
  for (const j of [...keep].sort((a, b) => a - b)) {
    const b = blocks[j];
    if (b.classList.contains('fm') || (b.classList.contains('md-comment') && !quotes.some((q) => normT(b.textContent).includes(normT(q))))) continue;
    if (prev !== null && j > prev + 1) el.insertAdjacentHTML('beforeend', '<span class="cw-gap" aria-hidden="true">· · ·</span>');
    el.appendChild(b); prev = j;
  }
  if (!keep.size) blocks.filter((b) => !b.classList.contains('fm')).slice(0, 8).forEach((b) => el.appendChild(b));
  const miss = quotes.filter((q) => !highlight(el, q));
  if (miss.length) el.insertAdjacentHTML('afterbegin', window.marked
    ? `<p class="cw-miss">Not found any more: ${miss.map((q) => `"${esc(q.slice(0, 90))}"`).join(', ')}. The doc may have changed; run /docs-check again.</p>`
    : '<p class="cw-miss">The Markdown renderer did not load, so the doc shows as plain text and the quote is not marked. Reload the page.</p>');
  trimTables(el);
  return { el, sec };
};

// ---------- item window: one window per finding, with its parts side by side ----------
const openItem = (id) => {
  const n = byNote.get(id); if (!n) return;
  const key = 'item:' + id;
  if (WM.wins.has(key)) { front(WM.wins.get(key)); return; }
  const sides = (n.sides || []).filter((s) => docs.has(s.doc));
  const ins = insets(), vw = innerWidth - ins.l - ins.r, vh = innerHeight - ins.t - ins.b;
  const w = Math.min(vw - 24, sides.length ? Math.max(640, sides.length * 440) : 560);
  const h = Math.min(vh - 48, sides.length ? 860 : 520);
  const win = makeWin(key, { title: `${n.id} · ${n.title}`, sub: n.kind, w, h, pos: { l: Math.max(12, Math.round((vw - w) / 2)), t: 24 } });
  if (!win) return;
  const rs = (n.rules || []).filter((r) => rules.has(r)), ds = docsOf(n).filter((x) => docs.has(x));
  const body = $('.win-body', win); body.style.overflow = 'hidden';
  body.innerHTML = `<div class="iw" data-kind="${n.kind}">
    <div class="iw-head">
      <div class="cw-t"><span class="pill" data-k="${n.kind}">${n.kind}</span><span class="nid">${esc(n.id)}</span><b>${esc(n.title)}</b>${markBox(n)}</div>
      <p class="iw-text">${esc(n.text)}</p>
      ${n.fix ? `<p class="iw-fix"><b>Suggested fix:</b> ${esc(n.fix)}</p>` : ''}
      <label class="iw-note"><span><b>What to do</b> · saved to findings.json; Claude follows it on the next /docs-check</span><textarea class="note-in" data-note-for="${esc(n.id)}" rows="2" placeholder="Tab: fix as suggested · keep as is · fix the other doc">${esc(n.note || '')}</textarea></label>
      ${rs.length ? `<details><summary>Rules involved · ${rs.length}</summary><ul class="rules">${rs.map((r) => ruleLi(rules.get(r), 'topic')).join('')}</ul></details>` : ''}
      ${!sides.length && ds.length ? `<div><h4 class="sum-h">Docs</h4>${chipList(ds)}</div>` : ''}
    </div>
    ${sides.length ? `<div class="iw-parts" style="--cols:${sides.length}"></div>` : ''}
  </div>`;
  const parts = $('.iw-parts', body);
  sides.forEach((s) => {
    const d = docs.get(s.doc), part = renderPart(d, s);
    const pane = document.createElement('section'); pane.className = 'pp'; pane.dataset.role = s.role;
    pane.innerHTML = `<header class="pp-h"><span class="role" data-r="${s.role}">${ROLE[s.role] || esc(s.role)}</span><b>${esc(d.kind === 'epic' ? `${d.epic} ${d.title}` : d.title)}</b><span class="cw-load"><i class="mark" data-l="${d.load}"></i>${LOADS[d.load]}</span><small title="${esc(d.id)}">${esc(d.id)}${part.sec ? ' › ' + esc(part.sec) : ''}</small></header><div class="pp-body"></div><footer class="pp-f"><button type="button" class="act" data-doc="${esc(s.doc)}" data-sec="${esc(part.sec)}">Open the whole doc</button>${board.querySelector(sel(s.doc)) ? `<button type="button" class="act" data-locate="${esc(s.doc)}">Show in map</button>` : ''}</footer>`;
    $('.pp-body', pane).appendChild(part.el);
    parts.appendChild(pane);
  });
  requestAnimationFrame(() => body.querySelectorAll('.pp-body').forEach((pb) => {
    const m = pb.querySelector('mark.cq');
    if (m) pb.scrollTop = Math.max(0, m.getBoundingClientRect().top - pb.getBoundingClientRect().top - pb.clientHeight / 3);
  }));
};

// ---------- the list: mark items, write what to do, remove marked items that have no note ----------
let lastRemoved = null, saveTimer = null, saving = false, again = false;
const setStatus = (text, undo = false) => { const p = $('#saveMsg'); p.hidden = !text; $('#saveText').textContent = text; $('[data-undo]', p).hidden = !undo; };
const removable = () => [...ticked].filter((id) => byNote.has(id) && !hasNote(byNote.get(id)));
const renderMarkbar = () => {
  const k = removable().length;
  $('#markbar').innerHTML = k ? `<span>${k} marked without a note</span><button type="button" class="act primary" data-remove-marked>Remove from list</button><button type="button" class="act" data-clear-marks>Unmark all</button>` : '';
};
const renderNotes = () => {
  // the list is rebuilt, so keep focus (and the caret in a note) where it was
  const a = document.activeElement, inList = a && $('#notesList').contains(a);
  const keep = !inList ? null : a.dataset.noteFor ? { sel: `.note-in[data-note-for="${CSS.escape(a.dataset.noteFor)}"]`, s: a.selectionStart, e: a.selectionEnd }
    : a.dataset.mark ? { sel: `.mk[data-mark="${CSS.escape(a.dataset.mark)}"]` } : null;
  $('#notesTitle').textContent = `Things to check · ${F.items.length}`;
  $('#notesHint').hidden = !(findingsState === 'ready' && F.items.length);
  renderMarkbar();
  $('#notesList').innerHTML = findingsState === 'loading' ? '<p class="notes-empty">Loading findings.json…</p>'
    : findingsState === 'missing' ? '<p class="notes-empty">No findings.json next to this page yet. Run /docs-check in a Claude session to write it.</p>'
    : !F.items.length ? '<p class="notes-empty">The list is empty. Run /docs-check to check the docs again.</p>'
    : KINDS.map(([k, label]) => { const l = F.items.filter((n) => n.kind === k); return l.length ? `<h4>${label} · ${l.length}</h4>${l.map((n) => noteRow(n)).join('')}` : ''; }).join('');
  const t = keep && $('#notesList ' + keep.sel);
  if (t) { t.focus({ preventScroll: true }); if (keep.s != null) t.setSelectionRange(keep.s, keep.e); }
};
// red counters on every doc and rule that holds a part of a conflict
const paintBadges = () => {
  document.querySelectorAll('button.cbadge').forEach((b) => b.remove());
  const put = (host, html, before) => { if (host && html) host.insertAdjacentHTML(before ? 'beforebegin' : 'beforeend', html); };
  board.querySelectorAll('[data-node]').forEach((el) => {
    const h = badge('doc:' + el.dataset.node); if (!h) return;
    const top = el.querySelector(':scope > .node-top');
    if (top) { const tag = top.querySelector('.tag'); tag ? put(tag, h, true) : put(top, h); }
    else put(el.classList.contains('feat') ? el.querySelector('.node-title') : el, h);
  });
  ctx.querySelectorAll('.src[data-doc]').forEach((el) => put(el.querySelector('.src-name'), badge('doc:' + el.dataset.doc)));
  ctx.querySelectorAll('.never .chip[data-doc]').forEach((el) => put(el, badge('doc:' + el.dataset.doc)));
  document.querySelectorAll('.rule[data-rule]').forEach((el) => put(el, ruleBadge(el.dataset.rule)));
  const n = F.items.filter((x) => x.kind === 'conflict' && !ticked.has(x.id) && !hasNote(x)).length;
  $('#legendC').hidden = !n;
  $('#mapSub').textContent = `${D.docs.length} files · ${totalLinks} links` + (findingsState === 'ready' ? ` · ${n} open conflict${n === 1 ? '' : 's'}` : '');
};
const refresh = () => { indexFindings(); paintBadges(); renderNotes(); };
const setMark = (id, on, fromList) => {
  if (on) ticked.add(id); else ticked.delete(id);
  document.querySelectorAll('.mk[data-mark]').forEach((c) => { if (c.dataset.mark === id) c.checked = on; });
  indexFindings(); paintBadges(); renderNotes();
  if (on && fromList) $(`#notesList .note-in[data-note-for="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
};

// saving: the page publishes only findings.json, a moment after you stop typing
const artifactApi = () => (window.claude?.use ? window.claude.use('artifact').catch(() => null) : Promise.resolve(null));
const PENDING = 'docsmap.pending';
const stash = () => { try { sessionStorage.setItem(PENDING, JSON.stringify({ notes: Object.fromEntries(F.items.filter(hasNote).map((n) => [n.id, n.note])), removed: lastRemoved ? lastRemoved.map(([n]) => n.id) : [] })); } catch (e) {} };
const unstash = () => { try { sessionStorage.removeItem(PENDING); } catch (e) {} };
const saveError = (err) => {
  const c = err?.code;
  if (c === 'conflict') return 'The page changed meanwhile and is reloading; your notes come back after it.';
  if (['not_writer', 'not_granted', 'not_declared', 'capability_disabled', 'capability_removed', 'consent_required'].includes(c)) return 'Not saved: this view cannot change the page.';
  if (c === 'rate_limited') return 'Not saved: too many saves in a row; it saves again with your next change.';
  return 'Not saved: ' + (err?.message || 'unknown error') + '.';
};
const flushSave = async (what = '') => {
  clearTimeout(saveTimer); saveTimer = null;
  if (saving) { again = true; return; }
  const lead = what ? what + ' ' : '';
  saving = true; setStatus(lead + 'Saving…');
  const api = await artifactApi();
  if (!api) { saving = false; setStatus(lead + 'Not saved: only the published page can save findings.json.', !!lastRemoved); return; }
  stash();
  try {
    await api.publish({ 'findings.json': JSON.stringify({ ...F, updated: new Date().toISOString().slice(0, 10) }, null, 2) + '\n' });
    unstash(); setStatus(lead + 'Saved to findings.json.', !!lastRemoved);
  } catch (err) {
    if (err?.code !== 'conflict') unstash();
    setStatus(lead + saveError(err), !!lastRemoved && err?.code !== 'conflict');
  }
  saving = false;
  if (again) { again = false; flushSave(); }
};
const scheduleSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => flushSave(), 1500); setStatus('Saving your note in a moment…'); };
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) flushSave(); });
document.addEventListener('input', (e) => {
  const t = e.target.closest?.('.note-in'), n = t && byNote.get(t.dataset.noteFor); if (!n) return;
  const had = hasNote(n);
  if (t.value.trim()) n.note = t.value; else delete n.note;
  if (had !== hasNote(n)) { indexFindings(); paintBadges(); }
  document.querySelectorAll('.note-in').forEach((x) => { if (x !== t && x.dataset.noteFor === n.id) x.value = t.value; });
  lastRemoved = null; renderMarkbar(); scheduleSave();
});
// a note typed in a window shows up in the list once you leave the field
document.addEventListener('focusout', (e) => { if (e.target.matches?.('.note-in') && !e.target.closest('#notesList')) setTimeout(renderNotes, 0); });
const removeMarked = () => {
  const ids = removable(); if (!ids.length || saving) return;
  lastRemoved = F.items.map((n, i) => [n, i]).filter(([n]) => ids.includes(n.id));
  F.items = F.items.filter((n) => !ids.includes(n.id));
  ids.forEach((id) => { ticked.delete(id); const w = WM.wins.get('item:' + id); if (w) closeWin(w); });
  refresh(); flushSave(`Removed ${ids.join(', ')}.`);
};
const undoRemove = () => {
  if (!lastRemoved || saving) return;
  for (const [n, i] of lastRemoved) F.items.splice(Math.min(i, F.items.length), 0, n);
  const ids = lastRemoved.map(([n]) => n.id); lastRemoved = null;
  refresh(); flushSave(`Put back ${ids.join(', ')}.`);
};
(async () => {
  renderNotes();
  try {
    const r = await fetch('findings.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(String(r.status));
    const j = await r.json();
    F = { ...j, items: Array.isArray(j.items) ? j.items : [] }; findingsState = 'ready';
  } catch (e) { findingsState = 'missing'; }
  // notes and removals that never saved (the page reloaded under them) come back
  let back = false;
  try {
    const p = JSON.parse(sessionStorage.getItem(PENDING) || 'null'); unstash();
    if (p) {
      for (const [id, text] of Object.entries(p.notes || {})) { const n = F.items.find((x) => x.id === id); if (n && !hasNote(n)) { n.note = text; back = true; } }
      for (const id of p.removed || []) if (F.items.some((x) => x.id === id)) { ticked.add(id); back = true; }
    }
  } catch (e) {}
  refresh();
  if (back) { setStatus('The page changed while you were working; your notes and marks are back.'); if (F.items.some(hasNote)) scheduleSave(); }
})();
})();
</script>
